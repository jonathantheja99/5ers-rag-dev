name: Scrape The 5ers FAQ

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at midnight
  workflow_dispatch: # Allow manual triggering

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Run scraper
        run: |
          # Create data directory if it doesn't exist
          mkdir -p data
          # We need to run the scraper, but we need to ensure the scraper writes to the correct path in GH actions
          python backend/scraper.py
        env:
          # In the action, we override the OUTPUT_DIR via env or just modify the script
          OUTPUT_DIR: 'data' 

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'jonathantheja99'
          git config --global user.email 'jonathantheja99@users.noreply.github.com'
          git add data/
          # Check if there are any changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update FAQ data [skip ci]"
            git push
          fi
